[package]
edition      = "2024"
name         = "firmware"
rust-version = "1.95"
version      = "0.1.0-alpha.0"

[[bin]]
name = "firmware"
path = "./src/bin/main.rs"
test = false

[[test]]
harness = false
name    = "hello_test"

[lib]
test = false

[dependencies]
protocol = { path = "../crates/protocol", default-features = false }
postcard = { version = "1" }

esp-hal = { version = "~1.2.2", features = ["esp32s3", "unstable", "log-04"] }
esp-rtos = { version = "0.4.0", features = ["esp32s3", "embassy", "log-04"] }
esp-println = { version = "0.18", default-features = false, features = ["esp32s3", "uart", "log-04", "critical-section", "colors"] }
esp-backtrace = { version = "0.20.0", features = ["esp32s3", "println"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3", "log-04"] }

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-sync     = { version = "0.8", features = ["log"] }
embassy-time     = { version = "0.5.0", features = ["log"] }
embassy-usb = { version = "0.6.0", default-features = false, features = ["log"] }

heapless = "0.9"
static_cell      = "2.1.1"
usbd-hid = "0.10"

esp-hal-smartled = "0.18"
smart-leds = "0.4"

log = "0.4"

[dev-dependencies]
defmt = "1.2.0"
rtt-target = { version = "0.6", features = ["defmt"] }
embedded-test = { version = "0.7.1", features = [
  "defmt",
  "embassy-010",
  "external-executor",
  "xtensa-semihosting",
] }

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
