[package]
name = "protocol"
version = "0.1.0"
edition = "2024"

[dependencies]
heapless = { version = "0.9", features = ["serde"] }
serde = { version = "1", default-features = false, features = ["derive"] }
postcard = { version = "1", default-features = false }
postcard-schema = { version = "0.2", default-features = false, features = ["derive", "heapless-v0_9"] }

[features]
default = ["std"]
std = []

[[example]]
name = "wireshark"
required-features = ["std"]